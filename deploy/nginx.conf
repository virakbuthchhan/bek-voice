server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # These containers serve browser inference only. Never expose the local
    # Python model service as an unauthenticated public inference API.
    location /api/ {
        default_type application/json;
        return 501 '{"error":"This deployment uses browser WebGPU inference. Select This browser in Settings."}';
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
